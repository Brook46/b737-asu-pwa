<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>737 NG Inside</title>
  <meta name="theme-color" content="#f2f2f0">
  <meta name="description" content="Explore the Boeing 737 NG systems inside a see-through 3D airplane, with operable schematics.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="737 Inside">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=15">
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-label="3D view of the 737"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="hotspots"></div>
  </div>

  <section id="schematic" class="schematic" hidden aria-label="Schematic">
    <div class="schem-scroll">
      <div id="schem-svg" class="schem-svg"></div>
      <aside id="schem-panel" class="schem-panel" aria-label="Flight deck controls"></aside>
    </div>
  </section>

  <header class="hud hud-tl">
    <a class="tag tag-btn" href="../flight-card-pwa/" id="suite-link" aria-label="Back to Flight Card">&lt; SUITE</a>
    <div class="tag tag-title">737 NG&nbsp;INSIDE</div>
    <button class="tag tag-btn" id="sys-current" aria-expanded="false" aria-controls="sys-list">[00] OVERVIEW ▾</button>
    <div class="tag-row">
      <button class="tag tag-btn" id="sys-prev">&lt;Prev</button><button class="tag tag-btn" id="sys-next">Next&gt;</button>
    </div>
    <nav id="sys-list" class="sys-list" hidden></nav>
  </header>

  <div class="hud hud-tr">
    <div class="seg" role="tablist" aria-label="View">
      <button class="tag tag-btn on" data-view="3d" role="tab" aria-selected="true" title="The airplane in 3D"><span class="vi">✈&#xFE0E;</span>Airplane</button><button class="tag tag-btn" data-view="schem" role="tab" aria-selected="false" title="System diagram and its overhead panel"><span class="vi">▦</span>Schematic</button><button class="tag tag-btn" data-view="split" role="tab" aria-selected="false" title="Airplane and schematic side by side"><span class="vi">◧</span>Split</button><button class="tag tag-btn" data-view="cockpit" role="tab" aria-selected="false" title="3D flight deck"><span class="vi">◉</span>Cockpit</button>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Tools">
      <div class="tb-group">
        <button class="tag tag-btn tb" id="qr-btn" title="Quick reference: memory items, maneuvers, limits"><span class="ti">QRH</span></button>
        <button class="tag tag-btn tb" id="learn-btn" title="Learn by voice and progress"><span class="ti">🎧</span><span class="tl">Learn</span></button>
        <button class="tag tag-btn tb" id="search-btn" title="Search every page"><span class="ti">⌕</span><span class="tl">Search</span></button>
        <button class="tag tag-btn tb" id="fav-btn" title="Favorites and highlights"><span class="ti">★</span><span class="tl">Saved</span></button>
      </div>
      <div class="tb-group">
        <button class="tag tag-btn tb" id="show-btn" title="What to show on the airplane" aria-haspopup="true" aria-expanded="false"><span class="ti">◎</span><span class="tl">Show ▾</span></button>
        <button class="tag tag-btn tb" id="theme-btn" title="Day / night"><span class="ti">◐</span><span class="tl">Night</span></button>
        <button class="tag tag-btn tb" id="home-btn" title="Reset view"><span class="ti">⌂</span><span class="tl">Home</span></button>
      </div>
      <div class="show-menu" id="show-menu" hidden>
        <div class="sm-title">Show on the airplane</div>
        <label><input type="checkbox" data-show="airflow"> Airflow <small>in flight</small></label>
        <label><input type="checkbox" data-show="lights"> Exterior lights</label>
        <label><input type="checkbox" data-show="crew"> Ground crew &amp; carts <small>at the gate</small></label>
        <label><input type="checkbox" data-show="doors"> Doors open</label>
        <label><input type="checkbox" data-show="evac"> Evacuation: slides &amp; exits</label>
        <label><input type="checkbox" data-show="links"> Light up parts for the page</label>
      </div>
    </div>
  </div>

  <div class="hud hud-bottom">
    <div class="seg" id="phases" role="tablist" aria-label="Phase of flight">
      <button class="tag tag-btn on" data-phase="ground">Ground</button><button class="tag tag-btn" data-phase="takeoff">Takeoff</button><button class="tag tag-btn" data-phase="cruise">Cruise</button><button class="tag tag-btn" data-phase="landing">Landing</button>
    </div>
    <div id="phase-note" class="phase-note"></div>
  </div>

  <aside id="sheet" class="sheet" aria-live="polite" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close tag tag-btn" id="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-body" class="sheet-body"></div>
  </aside>

  <div id="search" class="search" hidden>
    <div class="search-box" role="dialog" aria-label="Search">
      <div class="search-bar">
        <input type="search" placeholder="Search systems, parts, limits…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="tag tag-btn search-close" aria-label="Close search">✕</button>
      </div>
      <div class="search-results"></div>
    </div>
  </div>
  <div id="hl-pop" class="hl-pop" hidden></div>

  <div id="player" class="player" hidden aria-label="Lesson player">
    <div class="pl-row">
      <div class="pl-info"><div class="pl-k" id="pl-k"></div><div class="pl-t" id="pl-t"></div><div class="pl-bar"><span id="pl-prog"></span></div></div>
      <button class="pl-b" id="pl-close" aria-label="Stop">✕</button>
    </div>
    <div class="pl-row pl-ctrls">
      <button class="pl-b" id="pl-prev" aria-label="Previous page">⏮&#xFE0E;</button>
      <button class="pl-b" id="pl-back" aria-label="Previous sentence">⏪&#xFE0E;</button>
      <button class="pl-b pl-main" id="pl-play" aria-label="Play or pause">▶&#xFE0E;</button>
      <button class="pl-b" id="pl-fwd" aria-label="Next sentence">⏩&#xFE0E;</button>
      <button class="pl-b" id="pl-next" aria-label="Next page">⏭&#xFE0E;</button>
      <span class="pl-speed">
        <button class="pl-b" id="pl-slower" aria-label="Slower">−</button>
        <input type="range" id="pl-rate" min="0.5" max="2" step="0.05" value="1" aria-label="Reading speed">
        <button class="pl-b" id="pl-faster" aria-label="Faster">+</button>
        <output id="pl-rate-v">1.00×</output>
      </span>
    </div>
  </div>
  <div id="quiz" class="quiz" hidden><div class="quiz-card" id="quiz-card" role="dialog" aria-label="Quiz"></div></div>

  <div id="cp-bar" class="cp-bar" hidden>
    <div class="seg" role="tablist" aria-label="Look at">
      <button class="tag tag-btn" data-look="out">Out</button><button class="tag tag-btn" data-look="panel">Panel</button><button class="tag tag-btn" data-look="center">Center</button><button class="tag tag-btn" data-look="overhead">Overhead</button><button class="tag tag-btn" data-look="mcp">MCP</button><button class="tag tag-btn" data-look="pedestal">Pedestal</button><button class="tag tag-btn" data-look="aft">Aft · CBs</button>
    </div>
    <div class="cp-hint">Drag to look around · pinch to zoom · tap any switch, light or screen</div>
  </div>
  <div class="cp-sim" id="cp-sim" hidden>
      <button class="tag tag-btn" id="sim-cdu" title="Open the CDU">CDU</button>
      <button class="tag tag-btn" id="sim-lineup" title="Line up on the FMC departure runway">LINE UP</button>
      <button class="tag tag-btn" id="sim-toga" title="TO/GA: start the takeoff">TO/GA</button>
      <button class="tag tag-btn" id="sim-pause" title="Pause / run">❚❚</button>
      <span class="seg" id="sim-rate"><button class="tag tag-btn on" data-rate="1">1×</button><button class="tag tag-btn" data-rate="4">4×</button><button class="tag tag-btn" data-rate="16">16×</button><button class="tag tag-btn" data-rate="64">64×</button></span>
      <span class="seg"><button class="tag tag-btn" id="nd-rng-dn" title="ND range">RNG −</button><button class="tag tag-btn" id="nd-rng-up" title="ND range">RNG +</button></span>
      <output id="sim-state"></output>
    </div>
  <div id="cp-info" class="cp-info" hidden>
    <button class="cp-x" id="cp-info-x" aria-label="Close">✕</button>
    <div class="cp-t" id="cp-info-t"></div>
    <div class="cp-pos" id="cp-info-pos"></div>
    <p id="cp-info-text"></p>
    <button class="tag tag-btn" id="cp-info-go" hidden>Open page ›</button>
  </div>

  <div id="hint" class="hint">Drag to orbit · pinch to zoom · two fingers to pan</div>
  <div id="boot-error" class="boot-error" hidden></div>

  <script type="module" src="app.js?v=15"></script>
  <script>
    // If the module graph fails to evaluate, say so instead of a silent dead page.
    window.addEventListener('error', function (e) {
      var b = document.getElementById('boot-error');
      if (b && !window.__booted) { b.hidden = false; b.textContent = 'Failed to start: ' + (e.message || 'script error'); }
    });
  </script>
</body>
</html>
