<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Airline Radar — live airline flights</title>
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Live airline traffic on a map: flight numbers, routes, altitudes and aircraft types from open ADS-B data. Airliners only — no GA, no bizjets, no military.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Airline Radar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Leaflet (CDN, cached by the service worker). Raster tiles + DOM markers:
       no WebGL, so it runs on every phone and iPad in the bag. -->
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="app.css?v=11">
</head>
<body>
  <!-- The map is the app. The 3D canvas mounts into its own container on
       demand, so its ~1 MB of WebGL libraries never load unless asked for. -->
  <div id="map" class="map"></div>
  <div id="map3d" class="map map3d" hidden></div>

  <!-- Floating header: search, live state. No brand pill — the app's own name
       is the one thing on screen nobody needs to be told, and search gets its
       width back. -->
  <header class="topbar">
    <label class="search">
      <input id="search" type="search" placeholder="Tail (EKM) or flight — Enter adds another" autocomplete="off" aria-label="Search flights; press Enter to add another aircraft">
      <div id="suggest" class="suggest" hidden role="listbox" aria-label="Matching aircraft"></div>
    </label>
    <div id="live" class="live" data-mode="polling" title="Live"><i></i><span>Live</span></div>
  </header>

  <!-- What's showing, and how much of it — one line standing in for what used
       to be a chip per active filter, and the door back into Show. -->
  <button id="filter-bar" class="filter-bar" type="button" aria-label="Change what's shown"></button>

  <!-- Search terms being tracked, each removable on its own. -->
  <div id="chips" class="chips" hidden></div>

  <!-- Tool column: three things you actually reach for. Everything that used
       to be a standing button beside them — Labels, Trails, Last seen, Ground,
       3D — is a display preference you set once, not a live action, and now
       lives in View. -->
  <div class="tools">
    <button id="airline-btn" class="tool-btn" aria-pressed="false" title="Choose which traffic and which airlines to show">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16l-6.2 7.3V19l-3.6 2v-8.7z"/>
      </svg>
      <b>Show</b>
    </button>
    <button id="view-btn" class="tool-btn" aria-pressed="false" title="Map display settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <b>View</b>
    </button>
    <button id="locate-btn" class="tool-btn" title="Centre the map on me">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/>
        <line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/>
        <line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/>
      </svg>
      <b>Me</b>
    </button>
  </div>

  <!-- Show sheet: which traffic, which airlines -->
  <section id="picker" class="picker">
    <button id="picker-close" class="picker-close" aria-label="Close">✕</button>
    <div id="picker-body" class="picker-body"></div>
  </section>

  <!-- View sheet: display preferences, each with the one-line explanation a
       bare icon can't give, plus the altitude legend — colour only needs
       explaining once. -->
  <section id="viewsheet" class="picker">
    <button id="viewsheet-close" class="picker-close" aria-label="Close">✕</button>
    <div id="viewsheet-body" class="picker-body"></div>
  </section>

  <!-- Status / error banner -->
  <div id="status" class="status hidden"></div>

  <!-- Flight list sheet -->
  <section id="list" class="list-sheet">
    <button id="list-head" class="list-head">
      <span class="grip"></span>
      <span id="count" class="count">…</span>
      <span id="stamp" class="stamp"></span>
    </button>
    <div id="list-body" class="list-body"></div>
  </section>

  <!-- Detail sheet for the selected flight -->
  <section id="detail" class="detail-sheet">
    <div id="detail-body" class="detail-body"></div>
  </section>

  <script type="module" src="app.js?v=11"></script>
</body>
</html>
