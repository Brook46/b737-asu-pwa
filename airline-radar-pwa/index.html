<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Airline Radar — live airline flights</title>
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="Live airline traffic on a map: flight numbers, routes, altitudes and aircraft types from open ADS-B data. Airliners only — no GA, no bizjets, no military.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Airline Radar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Leaflet (CDN, cached by the service worker). Raster tiles + DOM markers:
       no WebGL, so it runs on every phone and iPad in the bag. -->
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="app.css?v=3">
</head>
<body>
  <!-- The map is the app -->
  <div id="map" class="map"></div>

  <!-- Floating header: brand, search, live state -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
        <path d="M16 16 L16 4" stroke="currentColor" stroke-width="1.4" opacity=".45"/>
        <path d="M16 8.5c.9 0 1.4 1.2 1.5 3v1.8l6.5 3.8v1.8l-6.5-2v3.4l2.3 1.7v1.3l-3.8-1-3.8 1v-1.3l2.3-1.7v-3.4l-6.5 2v-1.8l6.5-3.8v-1.8c.1-1.8.6-3 1.5-3z" fill="currentColor"/>
      </svg>
      <span>Airline Radar</span>
    </div>
    <label class="search">
      <input id="search" type="search" placeholder="Flight, tail (EKM), airline, airport" autocomplete="off" aria-label="Search flights">
    </label>
    <div id="live" class="live" data-mode="polling" title="Live"><i></i><span>Live</span></div>
  </header>

  <!-- Active filters -->
  <div id="chips" class="chips" hidden></div>

  <!-- Tool column. Every button is labelled: an icon alone is a guessing game. -->
  <div class="tools">
    <button id="airline-btn" class="tool-btn" aria-pressed="false" title="Show only chosen airlines">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16l-6.2 7.3V19l-3.6 2v-8.7z"/>
      </svg>
      <b>Airline</b>
    </button>
    <button id="labels-btn" class="tool-btn" aria-pressed="true" title="Callsign and altitude labels on the map">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 7h16M4 12h10M4 17h7"/>
      </svg>
      <b>Labels</b>
    </button>
    <button id="trails-btn" class="tool-btn" aria-pressed="true" title="Where each aircraft has been">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18c4 0 5-9 9-9s5 5 9 5" stroke-dasharray="3 3"/>
        <circle cx="20" cy="14" r="1.6" fill="currentColor" stroke="none"/>
      </svg>
      <b>Trails</b>
    </button>
    <button id="ghosts-btn" class="tool-btn" aria-pressed="true" title="Keep the last known position of aircraft that stop transmitting">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
        <path d="M12 8v4l2.5 1.6"/>
      </svg>
      <b>Last seen</b>
    </button>
    <button id="ground-btn" class="tool-btn" aria-pressed="false" title="Include aircraft on the ground">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M3 20h18"/><path d="M5 16l6-6 3 3 5-5"/>
      </svg>
      <b>Ground</b>
    </button>
    <button id="locate-btn" class="tool-btn" title="Centre the map on me">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/>
        <line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/>
        <line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/>
      </svg>
      <b>Me</b>
    </button>
  </div>

  <!-- Airline picker -->
  <section id="picker" class="picker">
    <button id="picker-close" class="picker-close" aria-label="Close airline picker">✕</button>
    <div id="picker-body" class="picker-body"></div>
  </section>

  <!-- Altitude legend -->
  <div id="legend" class="legend" aria-hidden="true"></div>

  <!-- Status / error banner -->
  <div id="status" class="status hidden"></div>

  <!-- Flight list sheet -->
  <section id="list" class="list-sheet">
    <button id="list-head" class="list-head">
      <span class="grip"></span>
      <span id="count" class="count">…</span>
      <span id="stamp" class="stamp"></span>
    </button>
    <div id="list-body" class="list-body"></div>
  </section>

  <!-- Detail sheet for the selected flight -->
  <section id="detail" class="detail-sheet">
    <div id="detail-body" class="detail-body"></div>
  </section>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
