<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Two planes trading places: the swap metaphor -->
  <g transform="translate(196 186) rotate(-90)">
    <path d="M-78 0 L52 -9 L80 0 L52 9 L-78 0 Z" fill="url(#up)"/>
    <path d="M-16 -7 L8 -30 L20 -30 L4 -7 Z" fill="url(#up)"/>
    <path d="M-16  7 L8  30 L20  30 L4  7 Z" fill="url(#up)"/>
    <path d="M-62 -5 L-50 -19 L-38 -19 L-46 -5 Z" fill="url(#up)"/>
    <path d="M-62  5 L-50  19 L-38  19 L-46  5 Z" fill="url(#up)"/>
  </g>

  <g transform="translate(316 326) rotate(90)">
    <path d="M-78 0 L52 -9 L80 0 L52 9 L-78 0 Z" fill="url(#dn)"/>
    <path d="M-16 -7 L8 -30 L20 -30 L4 -7 Z" fill="url(#dn)"/>
    <path d="M-16  7 L8  30 L20  30 L4  7 Z" fill="url(#dn)"/>
    <path d="M-62 -5 L-50 -19 L-38 -19 L-46 -5 Z" fill="url(#dn)"/>
    <path d="M-62  5 L-50  19 L-38  19 L-46  5 Z" fill="url(#dn)"/>
  </g>

  <!-- Exchange arrows tying them together -->
  <g stroke="#94a3b8" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M300 150 h74"/>
    <path d="M212 362 h-74"/>
  </g>
  <path d="M382 150 l-26 -15 v30 z" fill="#94a3b8"/>
  <path d="M130 362 l26 -15 v30 z" fill="#94a3b8"/>
</svg>
