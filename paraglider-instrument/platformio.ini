; PlatformIO project for the headless paragliding instrument.
; Firmware: `pio run -e xiao_esp32s3`   Upload: `pio run -e xiao_esp32s3 -t upload`
; Desktop tests of the logic layer use the Makefile (`make test`), not pio.
;
; Versions are pinned exactly: every library call in src/ was checked against
; these tags. Platform 6.9.0 = Arduino-ESP32 core 2.0.17. NimBLE-Arduino 2.x,
; RadioLib 8 and core 3.x all change APIs this code uses — upgrade deliberately.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DPG_LORA_TX_ENABLED=0
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    sparkfun/SparkFun u-blox GNSS v3@3.1.15
    jgromes/RadioLib@7.4.0
