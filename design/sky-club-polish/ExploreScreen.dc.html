<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #b5abfc; } a:hover { color: #d2cefd; }
    @keyframes ex-tw { 0%,100% { opacity:.28; transform:scale(.72); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes ex-corona { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.09); opacity:.26; } }
    @keyframes ex-shoot { 0% { transform: translate3d(0,0,0); opacity:0; } 4% { opacity:1; } 14% { transform: translate3d(186px,116px,0); opacity:0; } 100% { transform: translate3d(186px,116px,0); opacity:0; } }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0d0f1c; color: #e9e9ed;">

  <!-- ============ BACKGROUND ============ -->
  <div style="position: absolute; inset: 0; background:
      radial-gradient(105% 58% at 50% 46%, #24274f 0%, rgba(36,39,79,0) 62%),
      radial-gradient(85% 50% at 12% 8%, #33254a 0%, rgba(51,37,74,0) 66%),
      radial-gradient(80% 46% at 92% 88%, #1b2b52 0%, rgba(27,43,82,0) 68%),
      linear-gradient(#0b0d18 0%, #12142a 50%, #0e1020 100%);"></div>

  <!-- nebulosity -->
  <div style="position:absolute; left:-18%; top:2%; width:300px; height:220px; border-radius:50%; filter:blur(44px); mix-blend-mode:screen; opacity:.5;
      background: radial-gradient(circle at 42% 42%, rgba(214,150,235,.5), rgba(120,60,200,.2) 55%, transparent 74%);"></div>
  <div style="position:absolute; right:-20%; bottom:12%; width:280px; height:280px; border-radius:50%; filter:blur(46px); mix-blend-mode:screen; opacity:.44;
      background: radial-gradient(circle at 58% 42%, rgba(120,190,255,.45), rgba(60,80,200,.18) 55%, transparent 74%);"></div>
  <div style="position:absolute; left:52%; top:64%; width:210px; height:170px; border-radius:50%; filter:blur(40px); mix-blend-mode:screen; opacity:.34;
      background: radial-gradient(circle at 50% 50%, rgba(255,206,150,.42), rgba(200,100,60,.14) 55%, transparent 74%);"></div>

  <!-- depth stars -->
  <div style="position:absolute; inset:0;">
    <span style="position:absolute; left:7%;  top:9%;  width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.5;"></span>
    <span style="position:absolute; left:21%; top:16%; width:2px;  height:2px;  border-radius:50%;background:#eef4ff;opacity:.8;animation:ex-tw 4.4s ease-in-out infinite;"></span>
    <span style="position:absolute; left:36%; top:7%;  width:1.3px;height:1.3px;border-radius:50%;background:#c2c7dc;opacity:.5;"></span>
    <span style="position:absolute; left:52%; top:13%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.44;"></span>
    <span style="position:absolute; left:68%; top:6%;  width:2.3px;height:2.3px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 6px rgba(210,206,253,.9);animation:ex-tw 5.8s ease-in-out .9s infinite;"></span>
    <span style="position:absolute; left:84%; top:15%; width:1.4px;height:1.4px;border-radius:50%;background:#c2c7dc;opacity:.5;"></span>
    <span style="position:absolute; left:94%; top:29%; width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.45;"></span>
    <span style="position:absolute; left:4%;  top:33%; width:1.9px;height:1.9px;border-radius:50%;background:#dfe6ff;opacity:.7;animation:ex-tw 6.2s ease-in-out 1.6s infinite;"></span>
    <span style="position:absolute; left:12%; top:74%; width:1.3px;height:1.3px;border-radius:50%;background:#c2c7dc;opacity:.5;"></span>
    <span style="position:absolute; left:31%; top:82%; width:2px;  height:2px;  border-radius:50%;background:#eef4ff;opacity:.72;animation:ex-tw 4.9s ease-in-out .5s infinite;"></span>
    <span style="position:absolute; left:63%; top:78%; width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.44;"></span>
    <span style="position:absolute; left:88%; top:70%; width:1.6px;height:1.6px;border-radius:50%;background:#d2cefd;opacity:.6;"></span>
    <span style="position:absolute; left:46%; top:90%; width:1.3px;height:1.3px;border-radius:50%;background:#c2c7dc;opacity:.46;"></span>
  </div>

  <!-- one shooting star, long unequal cycle so it feels incidental -->
  <div style="position:absolute; left:9%; top:14%; animation: ex-shoot 19s cubic-bezier(.3,.1,.6,1) 4.2s infinite;">
    <div style="width:100px; height:1.8px; border-radius:999px; transform: rotate(32deg); transform-origin: 0 50%;
         background: linear-gradient(90deg, rgba(233,233,237,0), rgba(210,206,253,.65) 55%, #f5f4ff);
         filter: drop-shadow(0 0 6px rgba(181,171,252,.85));"></div>
  </div>

  <!-- ============ HEADER ============ -->
  <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 52px 18px 0; z-index: 5;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b5abfc; box-shadow: 0 0 12px #9184d9;"></span>
      <span style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #9397ab; font-weight: 600;">Mission control</span>
    </div>
    <span style="display: flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 999px; background: rgba(35,37,50,.55); border: 1px solid rgba(150,138,224,.28); color: #d2cefd; font-size: 12px; font-weight: 700;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#b5abfc"><path d="M12 2.6l2.7 5.9 6.4.7-4.8 4.3 1.3 6.3L12 16.6 6.4 19.8l1.3-6.3L2.9 9.2l6.4-.7z"/></svg>
      4/10
    </span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 104px; z-index: 5;">
    <h1 style="font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 0; color: #e9e9ed;">Our star's family</h1>
    <p style="font-size: 14px; margin: 4px 0 0; color: #cfd3e5;">Tap a world to visit it.</p>
  </div>

  <!-- ============ ORRERY ============ -->
  <!-- Orbit rings sit on a faint gradient stroke rather than a flat 10% white, so
       the near side reads brighter than the far side and the plane has depth. -->
  <svg style="position:absolute; left:0; top:0;" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <defs>
      <linearGradient id="exRing" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(233,233,237,.05)"/>
        <stop offset="50%"  stop-color="rgba(233,233,237,.16)"/>
        <stop offset="100%" stop-color="rgba(233,233,237,.06)"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#exRing)" stroke-width="1">
      <circle cx="195" cy="430" r="40"/>
      <circle cx="195" cy="430" r="55"/>
      <circle cx="195" cy="430" r="71"/>
      <circle cx="195" cy="430" r="88"/>
      <circle cx="195" cy="430" r="112"/>
      <circle cx="195" cy="430" r="138"/>
      <circle cx="195" cy="430" r="156"/>
      <circle cx="195" cy="430" r="172"/>
    </g>
  </svg>

  <!-- Sun: layered corona instead of a single box-shadow -->
  <div style="position:absolute; left:195px; top:430px; transform:translate(-50%,-50%);">
    <span style="position:absolute; left:50%; top:50%; width:200px; height:200px; margin:-100px 0 0 -100px; border-radius:50%; display:block;
        background: radial-gradient(circle, rgba(255,196,92,.3) 0%, rgba(255,196,92,0) 68%); animation: ex-corona 4.6s ease-in-out infinite;"></span>
    <span style="position:absolute; left:50%; top:50%; width:112px; height:112px; margin:-56px 0 0 -56px; border-radius:50%; display:block;
        background: radial-gradient(circle, rgba(255,170,70,.34) 0%, rgba(255,170,70,0) 70%);"></span>
    <span style="position:relative; display:block; width:52px; height:52px; border-radius:50%;
        background: radial-gradient(circle at 36% 30%, #fff3c4, #ffc45c 42%, #f08a2c 78%, #c25a15);
        box-shadow: 0 0 34px rgba(255,177,74,.7), 0 0 90px rgba(255,140,40,.38);"></span>
  </div>

  <!-- Planets. Each is a two-tone sphere (catalog light/dark) with a specular
       highlight and a limb shadow, so they read as lit balls not flat discs. -->
  <!-- Mercury -->
  <div style="position:absolute; left:160px; top:410px; transform:translate(-50%,-50%); width:12px; height:12px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #d8cdc2 42%, #6f6157 88%);
      box-shadow: 0 0 11px rgba(233,233,237,.35), inset -2px -3px 5px rgba(0,0,0,.55);"></div>
  <!-- Venus -->
  <div style="position:absolute; left:230px; top:388px; transform:translate(-50%,-50%); width:15px; height:15px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #f7e3b4 42%, #b8863c 88%);
      box-shadow: 0 0 14px rgba(233,233,237,.35), inset -2px -3px 6px rgba(0,0,0,.55);"></div>
  <!-- Earth, with its atmosphere rim and the Moon -->
  <div style="position:absolute; left:259px; top:460px; transform:translate(-50%,-50%); width:16px; height:16px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #8fd0ee 42%, #255f92 88%);
      box-shadow: 0 0 6px 1px rgba(110,190,255,.6), 0 0 15px rgba(233,233,237,.3), inset -2px -3px 6px rgba(0,0,0,.5);"></div>
  <div style="position:absolute; left:272px; top:449px; transform:translate(-50%,-50%); width:5px; height:5px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #f3f5fe 42%, #9397ab 88%); box-shadow: 0 0 4px rgba(233,233,237,.5);"></div>
  <!-- Mars -->
  <div style="position:absolute; left:123px; top:480px; transform:translate(-50%,-50%); width:13px; height:13px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #f09468 42%, #93381f 88%);
      box-shadow: 0 0 12px rgba(233,233,237,.32), inset -2px -3px 5px rgba(0,0,0,.55);"></div>
  <!-- Jupiter -->
  <div style="position:absolute; left:166px; top:322px; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #f2d3ac 42%, #94643c 88%);
      box-shadow: 0 0 26px rgba(233,233,237,.32), inset -3px -5px 10px rgba(0,0,0,.5);"></div>
  <!-- Saturn + ring -->
  <div style="position:absolute; left:253px; top:555px; transform:translate(-50%,-50%); width:30px; height:30px;">
    <span style="position:absolute; left:50%; top:50%; width:69px; height:21px; margin:-10.5px 0 0 -34.5px; border-radius:50%;
        border: 2px solid rgba(246,229,184,.75); transform: rotate(-18deg); display:block;"></span>
    <span style="position:absolute; inset:0; border-radius:50%; display:block;
        background: radial-gradient(circle at 33% 28%, #fff, #f6e5b8 42%, #a8874a 88%);
        box-shadow: 0 0 24px rgba(233,233,237,.32), inset -3px -4px 9px rgba(0,0,0,.5);"></span>
  </div>
  <!-- Uranus -->
  <div style="position:absolute; left:40px; top:416px; transform:translate(-50%,-50%); width:22px; height:22px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #bdeef2 42%, #4b8c9c 88%);
      box-shadow: 0 0 18px rgba(233,233,237,.32), inset -2px -4px 7px rgba(0,0,0,.5);"></div>
  <!-- Neptune, already collected: accent ring -->
  <div style="position:absolute; left:281px; top:281px; transform:translate(-50%,-50%); width:21px; height:21px; border-radius:50%;
      background: radial-gradient(circle at 33% 28%, #fff, #9db4f7 42%, #2f4794 88%);
      box-shadow: 0 0 18px rgba(233,233,237,.32), inset -2px -4px 7px rgba(0,0,0,.5);
      outline: 2px solid rgba(181,171,252,.85); outline-offset: 3px;"></div>

  <!-- ============ CONSOLIDATED CONTROL BAR ============ -->
  <!-- One bar instead of today's two stacked ones: the date lives in the scrubber,
       every target is 52px, and the orrery gets ~110px of sky back. -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: calc(14px + 78px); display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 999px; background: rgba(35,37,50,.62); border: 1px solid rgba(150,138,224,.28);">
    <div style="width: 52px; height: 52px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(180deg, rgba(89,79,138,.5), rgba(66,58,106,.32)); border: 1px solid #9184d9;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#e7e5fe"><path d="M5 5h4v14H5zm10 0h4v14h-4z"/></svg>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px;">
      <div style="position: relative; height: 22px; display: flex; align-items: center;">
        <div style="width: 100%; height: 5px; border-radius: 3px; background: #2b2741;"></div>
        <div style="position: absolute; left: 0; width: 46%; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #796cbf, #b5abfc);"></div>
        <div style="position: absolute; left: 46%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #b5abfc; border: 2px solid #161826; box-shadow: 0 0 12px rgba(150,138,224,.85);"></div>
      </div>
      <div style="text-align: center; font-size: 12.5px; font-weight: 700; color: #d2cefd; letter-spacing: .02em;">14 Mar 2026</div>
    </div>
    <div style="width: 52px; height: 52px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(150,138,224,.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#e9e9ed"><path d="M12 2.6l1.6 4.3 4.3 1.6-4.3 1.6L12 14.4l-1.6-4.3L6.1 8.5l4.3-1.6zM18.5 14l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/></svg>
    </div>
  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding-bottom: 14px; background: rgba(22,24,38,.92); border-top: 1px solid #3f424d;">
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid #9184d9; background:rgba(66,58,106,.45); color:#e7e5fe;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/><path d="M3.4 8.6c1.6-1.6 5.4-1.3 9.4.7s6.6 4.9 6 6.9c-.4 1.4-2.2 2.1-4.6 2v-2c1.7.1 2.6-.3 2.7-.6.2-.6-1.4-2.8-4.9-4.5s-6.2-1.7-6.6-1.3c-.3.3-.1 1.2.8 2.4l-1.6 1.2c-1.3-1.8-1.7-3.6-1.2-4.8z"/></svg>
      <span style="font-size:12px; font-weight:600;">Explore</span>
    </div>
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid transparent; color:#75798c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h3a1 1 0 0 1 1 1v5H6V5a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v5h-5V5a1 1 0 0 1 1-1zM6 11.5h5v2.2a2.5 2.5 0 1 1-5 0zm7 0h5v2.2a2.5 2.5 0 1 1-5 0z"/><circle cx="8.5" cy="16.5" r="3.5"/><circle cx="15.5" cy="16.5" r="3.5"/></svg>
      <span style="font-size:12px; font-weight:600;">Sky</span>
    </div>
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid transparent; color:#75798c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="9" r="6"/><path d="M8.4 14.6 7 21.5l5-2.4 5 2.4-1.4-6.9a7.9 7.9 0 0 1-7.2 0z"/></svg>
      <span style="font-size:12px; font-weight:600;">Badges</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
