<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #b5abfc; } a:hover { color: #d2cefd; }
    @keyframes st-pulse { 0%,100% { opacity:.85; transform:scale(1); } 50% { opacity:1; transform:scale(1.06); } }
    @keyframes st-spike { 0%,100% { opacity:.55; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.05); } }
    @keyframes st-tw { 0%,100% { opacity:.25; transform:scale(.7); } 50% { opacity:1; transform:scale(1.2); } }
  </style>
</helmet>

<!-- 390x844: the STAR information sheet. The brief asked for star info to look
     "way more realistic" — so the star is rendered the way a bright star actually
     presents (point core, chromatic halo, diffraction spikes) rather than as a
     glowing ball, and the panel answers the questions the old one didn't. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0d0f1c; color: #e9e9ed;">

  <div style="position: absolute; inset: 0; background:
      radial-gradient(110% 62% at 50% 6%, #23264f 0%, rgba(35,38,79,0) 60%),
      linear-gradient(#080a14 0%, #0f1120 52%, #14162a 100%);"></div>

  <!-- faint field stars -->
  <div style="position: absolute; inset: 0;">
    <span style="position:absolute; left:11%; top:9%;  width:1.6px; height:1.6px; border-radius:50%; background:#cfd3e5; opacity:.6;"></span>
    <span style="position:absolute; left:28%; top:16%; width:2.2px; height:2.2px; border-radius:50%; background:#fff; opacity:.8; box-shadow:0 0 5px rgba(210,206,253,.8); animation: st-tw 4.6s ease-in-out infinite;"></span>
    <span style="position:absolute; left:47%; top:7%;  width:1.3px; height:1.3px; border-radius:50%; background:#9397ab; opacity:.5;"></span>
    <span style="position:absolute; left:69%; top:13%; width:1.8px; height:1.8px; border-radius:50%; background:#d2cefd; opacity:.65; animation: st-tw 6s ease-in-out 1.2s infinite;"></span>
    <span style="position:absolute; left:86%; top:22%; width:1.5px; height:1.5px; border-radius:50%; background:#cfd3e5; opacity:.55;"></span>
    <span style="position:absolute; left:8%;  top:30%; width:1.4px; height:1.4px; border-radius:50%; background:#cfd3e5; opacity:.5;"></span>
    <span style="position:absolute; left:91%; top:38%; width:1.2px; height:1.2px; border-radius:50%; background:#9397ab; opacity:.45;"></span>
  </div>

  <!-- status bar -->
  <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 52px 18px 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b5abfc; box-shadow: 0 0 12px #9184d9;"></span>
      <span style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #9397ab; font-weight: 600;">Mission control</span>
    </div>
    <span style="display: flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 999px; background: rgba(35,37,50,.55); border: 1px solid rgba(150,138,224,.28); color: #d2cefd; font-size: 12px; font-weight: 700;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#b5abfc"><path d="M12 2.6l2.7 5.9 6.4.7-4.8 4.3 1.3 6.3L12 16.6 6.4 19.8l1.3-6.3L2.9 9.2l6.4-.7z"/></svg>
      4/10
    </span>
  </div>

  <!-- ============ THE STAR ============ -->
  <!-- A real bright star is a point source: an unresolvable core, a chromatic
       halo from atmospheric scatter, and diffraction spikes. Colour is Betelgeuse's
       actual catalogue tint (#ff8f6b in data/stars.json), not a generic yellow. -->
  <div style="position: absolute; left: 50%; top: 250px; transform: translate(-50%, -50%);">
    <svg width="300" height="300" viewBox="0 0 300 300" aria-label="Betelgeuse">
      <defs>
        <radialGradient id="stHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="rgba(255,225,205,.95)"/>
          <stop offset="12%"  stop-color="rgba(255,168,128,.55)"/>
          <stop offset="30%"  stop-color="rgba(255,143,107,.26)"/>
          <stop offset="58%"  stop-color="rgba(214,110,90,.10)"/>
          <stop offset="100%" stop-color="rgba(255,143,107,0)"/>
        </radialGradient>
        <radialGradient id="stCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="38%"  stop-color="#fff2e6"/>
          <stop offset="70%"  stop-color="#ffb894"/>
          <stop offset="100%" stop-color="rgba(255,143,107,0)"/>
        </radialGradient>
        <linearGradient id="stSpikeH" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="rgba(255,143,107,0)"/>
          <stop offset="34%"  stop-color="rgba(255,190,160,.5)"/>
          <stop offset="50%"  stop-color="rgba(255,245,235,.95)"/>
          <stop offset="66%"  stop-color="rgba(255,190,160,.5)"/>
          <stop offset="100%" stop-color="rgba(255,143,107,0)"/>
        </linearGradient>
        <linearGradient id="stSpikeV" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="rgba(255,143,107,0)"/>
          <stop offset="34%"  stop-color="rgba(255,190,160,.5)"/>
          <stop offset="50%"  stop-color="rgba(255,245,235,.95)"/>
          <stop offset="66%"  stop-color="rgba(255,190,160,.5)"/>
          <stop offset="100%" stop-color="rgba(255,143,107,0)"/>
        </linearGradient>
        <filter id="stBlur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.1"/>
        </filter>
      </defs>

      <circle cx="150" cy="150" r="140" fill="url(#stHalo)" style="animation: st-pulse 5s ease-in-out infinite; transform-origin: 150px 150px;"/>

      <!-- diffraction spikes: long primary pair, shorter secondary pair at 45° -->
      <g style="animation: st-spike 4.2s ease-in-out infinite; transform-origin: 150px 150px;" filter="url(#stBlur)">
        <rect x="18"  y="148.4" width="264" height="3.2" fill="url(#stSpikeH)"/>
        <rect x="148.4" y="18"  width="3.2" height="264" fill="url(#stSpikeV)"/>
        <g transform="rotate(45 150 150)" opacity=".42">
          <rect x="56"  y="149.2" width="188" height="1.6" fill="url(#stSpikeH)"/>
          <rect x="149.2" y="56"  width="1.6" height="188" fill="url(#stSpikeV)"/>
        </g>
      </g>

      <circle cx="150" cy="150" r="30" fill="url(#stCore)" style="animation: st-pulse 3.4s ease-in-out infinite; transform-origin: 150px 150px;"/>
      <circle cx="150" cy="150" r="6.5" fill="#ffffff"/>
    </svg>
  </div>

  <!-- ============ SHEET ============ -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #232532; border: 1px solid #3f424d; border-bottom: none; border-radius: 24px 24px 0 0; padding: 12px 20px 26px; box-shadow: 0 -12px 40px rgba(0,0,0,.5);">

    <div style="width: 36px; height: 4px; border-radius: 2px; background: #3f424d; margin: 0 auto 14px;"></div>

    <div style="position: absolute; top: 14px; right: 16px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(150,138,224,.28);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#e9e9ed"><path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 1 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4z"/></svg>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px;">
      <h2 style="font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0; color: #e9e9ed;">Betelgeuse</h2>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #ff9d7d;">Red supergiant</span>
    </div>
    <p style="font-size: 15.5px; line-height: 1.45; margin: 0 0 16px; color: #cfd3e5; max-width: 300px; text-wrap: pretty;">A giant red star so big it could swallow Mars' whole orbit.</p>

    <!-- where it sits in its constellation: the app already stores these line
         segments, so this is drawn from real data rather than decoration -->
    <div style="display: flex; gap: 12px; align-items: stretch; margin-bottom: 16px;">
      <div style="flex: 0 0 auto; width: 104px; padding: 10px; border-radius: 14px; background: rgba(13,15,28,.5); border: 1px solid #3f424d;">
        <div style="font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #75798c; font-weight: 700; margin-bottom: 6px;">In Orion</div>
        <svg width="84" height="76" viewBox="0 0 84 76">
          <g stroke="rgba(207,211,229,.35)" stroke-width="1" stroke-dasharray="2 3">
            <line x1="20" y1="14" x2="58" y2="10"/>
            <line x1="20" y1="14" x2="30" y2="36"/>
            <line x1="58" y1="10" x2="52" y2="36"/>
            <line x1="30" y1="36" x2="42" y2="38"/>
            <line x1="42" y1="38" x2="52" y2="36"/>
            <line x1="30" y1="36" x2="24" y2="64"/>
            <line x1="52" y1="36" x2="62" y2="62"/>
          </g>
          <circle cx="58" cy="10" r="2"   fill="#eef4ff" opacity=".8"/>
          <circle cx="30" cy="36" r="1.8" fill="#eef4ff" opacity=".7"/>
          <circle cx="42" cy="38" r="1.8" fill="#eef4ff" opacity=".7"/>
          <circle cx="52" cy="36" r="1.8" fill="#eef4ff" opacity=".7"/>
          <circle cx="24" cy="64" r="2.2" fill="#cfe0ff" opacity=".85"/>
          <circle cx="62" cy="62" r="1.6" fill="#eef4ff" opacity=".6"/>
          <!-- Betelgeuse: the shoulder, highlighted -->
          <circle cx="20" cy="14" r="7" fill="rgba(255,143,107,.28)"/>
          <circle cx="20" cy="14" r="3.4" fill="#ff8f6b"/>
          <circle cx="20" cy="14" r="1.4" fill="#fff2e6"/>
        </svg>
      </div>

      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 12px; background: rgba(13,15,28,.5); border: 1px solid #3f424d;">
          <span style="font-size: 12px; color: #9397ab; font-weight: 600;">Brightness</span>
          <span style="display: flex; align-items: center; gap: 7px;">
            <span style="display: flex; gap: 3px;">
              <i style="width:6px; height:6px; border-radius:50%; background:#ff8f6b; display:block;"></i>
              <i style="width:6px; height:6px; border-radius:50%; background:#ff8f6b; display:block;"></i>
              <i style="width:6px; height:6px; border-radius:50%; background:#ff8f6b; display:block;"></i>
              <i style="width:6px; height:6px; border-radius:50%; background:#ff8f6b; display:block;"></i>
              <i style="width:6px; height:6px; border-radius:50%; background:#3f424d; display:block;"></i>
            </span>
            <span style="font-size: 13px; font-weight: 700; color: #e9e9ed;">Very bright</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 12px; background: rgba(13,15,28,.5); border: 1px solid #3f424d;">
          <span style="font-size: 12px; color: #9397ab; font-weight: 600;">Colour</span>
          <span style="display: flex; align-items: center; gap: 7px;">
            <i style="width:12px; height:12px; border-radius:50%; background:#ff8f6b; box-shadow:0 0 8px rgba(255,143,107,.8); display:block;"></i>
            <span style="font-size: 13px; font-weight: 700; color: #e9e9ed;">Orange‑red</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 12px; background: rgba(13,15,28,.5); border: 1px solid #3f424d;">
          <span style="font-size: 12px; color: #9397ab; font-weight: 600;">Distance</span>
          <span style="font-size: 13px; font-weight: 700; color: #e9e9ed;">548 light‑years</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 56px; height: 56px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: rgba(35,37,50,.55); border: 1px solid rgba(150,138,224,.28);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#cfd3e5"><path d="M15.3 4.3a1 1 0 0 1 0 1.4L9 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0z"/></svg>
      </div>
      <div style="flex: 1 1 auto; height: 56px; display: flex; align-items: center; justify-content: center; gap: 9px; border-radius: 18px; border: 1px solid #9184d9; background: linear-gradient(180deg, rgba(89,79,138,.5), rgba(66,58,106,.32)); color: #e9e9ed; font-size: 15.5px; font-weight: 700; box-shadow: 0 6px 18px rgba(66,58,106,.4), inset 0 1px 0 rgba(233,233,237,.09);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#b5abfc"><path d="M11 3.5a1 1 0 0 1 2 0v1.1a7.4 7.4 0 0 1 6.4 6.4h1.1a1 1 0 0 1 0 2h-1.1a7.4 7.4 0 0 1-6.4 6.4v1.1a1 1 0 0 1-2 0v-1.1A7.4 7.4 0 0 1 4.6 13H3.5a1 1 0 0 1 0-2h1.1A7.4 7.4 0 0 1 11 4.6zM12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2z"/></svg>
        Hear about it
      </div>
      <div style="width: 56px; height: 56px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: rgba(35,37,50,.55); border: 1px solid rgba(150,138,224,.28);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#cfd3e5"><path d="M8.7 4.3a1 1 0 0 0 0 1.4L15 12l-6.3 6.3a1 1 0 1 0 1.4 1.4l7-7a1 1 0 0 0 0-1.4l-7-7a1 1 0 0 0-1.4 0z"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
