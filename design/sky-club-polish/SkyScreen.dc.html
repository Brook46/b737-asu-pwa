<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #b5abfc; } a:hover { color: #d2cefd; }
    @keyframes sk-tw { 0%,100% { opacity:.28; transform:scale(.72); } 50% { opacity:1; transform:scale(1.18); } }
    @keyframes sk-ret { 0%,100% { transform:scale(1); opacity:.55; } 50% { transform:scale(1.14); opacity:.12; } }
    /* Each shooting star runs its own long cycle and is visible for only a sliver
       of it, so they never fall in step or repeat on a readable rhythm. */
    @keyframes sk-shootA { 0% { transform: translate3d(0,0,0); opacity:0; } 3% { opacity:1; } 13% { transform: translate3d(210px,132px,0); opacity:0; } 100% { transform: translate3d(210px,132px,0); opacity:0; } }
    @keyframes sk-shootB { 0% { transform: translate3d(0,0,0); opacity:0; } 4% { opacity:.9; } 15% { transform: translate3d(-168px,104px,0); opacity:0; } 100% { transform: translate3d(-168px,104px,0); opacity:0; } }
    @keyframes sk-shootC { 0% { transform: translate3d(0,0,0); opacity:0; } 5% { opacity:.75; } 17% { transform: translate3d(140px,188px,0); opacity:0; } 100% { transform: translate3d(140px,188px,0); opacity:0; } }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #06070f; color: #e9e9ed;">

  <!-- ============ BACKGROUND ============ -->
  <!-- Deep space overhead grading into airglow at the horizon, instead of the flat
       three-stop ramp. This is what gives the screen a sense of "up". -->
  <div style="position: absolute; inset: 0; background:
      linear-gradient(#05060d 0%, #0a0c1a 26%, #101430 52%, #17203f 74%, #1d2a4e 88%, #24325a 100%);"></div>
  <!-- airglow band just above the horizon -->
  <div style="position: absolute; left: -10%; right: -10%; bottom: 70px; height: 260px; filter: blur(34px); opacity: .5;
      background: radial-gradient(60% 100% at 50% 100%, rgba(94,132,196,.55), rgba(56,74,140,.2) 55%, transparent 78%);"></div>

  <!-- ============ MILKY WAY ============ -->
  <!-- A real textured band with a brighter galactic bulge and dark dust lanes,
       drawn with feTurbulence so it has structure instead of being a smear. -->
  <svg style="position:absolute; inset:0;" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <defs>
      <filter id="mwTex" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.05" numOctaves="5" seed="23" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-.28"/></feComponentTransfer>
      </filter>
      <filter id="mwSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="mwLane" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      <linearGradient id="mwFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
        <stop offset="18%"  stop-color="rgba(255,255,255,.55)"/>
        <stop offset="50%"  stop-color="rgba(255,255,255,.95)"/>
        <stop offset="82%"  stop-color="rgba(255,255,255,.5)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>
      <mask id="mwMask">
        <rect x="-60" y="0" width="510" height="470" fill="url(#mwFade)"/>
      </mask>
      <radialGradient id="mwBulge" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(226,214,236,.5)"/>
        <stop offset="45%"  stop-color="rgba(180,168,214,.22)"/>
        <stop offset="100%" stop-color="rgba(150,138,224,0)"/>
      </radialGradient>
    </defs>

    <g transform="rotate(-26 195 250)" mask="url(#mwMask)" opacity=".85">
      <!-- diffuse glow of the band -->
      <rect x="-60" y="120" width="510" height="240" fill="rgba(186,190,228,.14)" filter="url(#mwSoft)"/>
      <!-- star-cloud texture -->
      <rect x="-60" y="96" width="510" height="290" fill="#cdd2ee" filter="url(#mwTex)" opacity=".5"/>
      <!-- galactic bulge -->
      <ellipse cx="150" cy="242" rx="150" ry="86" fill="url(#mwBulge)"/>
      <!-- dark dust lanes cutting through, the detail that sells it as the Milky Way -->
      <g filter="url(#mwLane)" opacity=".8">
        <ellipse cx="120" cy="248" rx="200" ry="13" fill="#06070f" opacity=".75" transform="rotate(3 120 248)"/>
        <ellipse cx="290" cy="222" rx="110" ry="9"  fill="#06070f" opacity=".6"  transform="rotate(-4 290 222)"/>
        <ellipse cx="40"  cy="272" rx="90"  ry="8"  fill="#06070f" opacity=".5"/>
      </g>
    </g>
  </svg>

  <!-- ============ STARS ============ -->
  <!-- Three depth tiers plus real catalogue tints, so the field has structure -->
  <div style="position: absolute; inset: 0;">
    <!-- far, faint -->
    <span style="position:absolute; left:6%;  top:8%;  width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.5;"></span>
    <span style="position:absolute; left:17%; top:15%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.42;"></span>
    <span style="position:absolute; left:31%; top:6%;  width:1.3px;height:1.3px;border-radius:50%;background:#c2c7dc;opacity:.5;"></span>
    <span style="position:absolute; left:44%; top:20%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.4;"></span>
    <span style="position:absolute; left:58%; top:9%;  width:1.2px;height:1.2px;border-radius:50%;background:#c2c7dc;opacity:.46;"></span>
    <span style="position:absolute; left:72%; top:18%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.42;"></span>
    <span style="position:absolute; left:85%; top:11%; width:1.3px;height:1.3px;border-radius:50%;background:#c2c7dc;opacity:.5;"></span>
    <span style="position:absolute; left:94%; top:26%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.4;"></span>
    <span style="position:absolute; left:12%; top:33%; width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.44;"></span>
    <span style="position:absolute; left:37%; top:41%; width:1.1px;height:1.1px;border-radius:50%;background:#c2c7dc;opacity:.4;"></span>
    <span style="position:absolute; left:63%; top:36%; width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.44;"></span>
    <span style="position:absolute; left:79%; top:45%; width:1.1px;height:1.1px;border-radius:50%;background:#c2c7dc;opacity:.4;"></span>
    <span style="position:absolute; left:23%; top:52%; width:1.2px;height:1.2px;border-radius:50%;background:#aab0c6;opacity:.42;"></span>
    <span style="position:absolute; left:52%; top:57%; width:1.1px;height:1.1px;border-radius:50%;background:#aab0c6;opacity:.38;"></span>

    <!-- mid -->
    <span style="position:absolute; left:9%;  top:22%; width:2px;height:2px;border-radius:50%;background:#eef4ff;opacity:.75;animation:sk-tw 4.4s ease-in-out infinite;"></span>
    <span style="position:absolute; left:26%; top:28%; width:1.9px;height:1.9px;border-radius:50%;background:#dfe6ff;opacity:.7;animation:sk-tw 5.8s ease-in-out .9s infinite;"></span>
    <span style="position:absolute; left:48%; top:13%; width:2.1px;height:2.1px;border-radius:50%;background:#eef4ff;opacity:.78;animation:sk-tw 3.9s ease-in-out 1.7s infinite;"></span>
    <span style="position:absolute; left:67%; top:25%; width:1.9px;height:1.9px;border-radius:50%;background:#ffd9c2;opacity:.72;animation:sk-tw 6.2s ease-in-out .4s infinite;"></span>
    <span style="position:absolute; left:88%; top:33%; width:2px;height:2px;border-radius:50%;background:#eef4ff;opacity:.74;animation:sk-tw 4.9s ease-in-out 2.2s infinite;"></span>
    <span style="position:absolute; left:19%; top:44%; width:1.9px;height:1.9px;border-radius:50%;background:#dfe6ff;opacity:.68;animation:sk-tw 5.2s ease-in-out 1.1s infinite;"></span>
    <span style="position:absolute; left:74%; top:53%; width:2px;height:2px;border-radius:50%;background:#eef4ff;opacity:.7;animation:sk-tw 4.1s ease-in-out .6s infinite;"></span>
    <span style="position:absolute; left:41%; top:62%; width:1.8px;height:1.8px;border-radius:50%;background:#dfe6ff;opacity:.62;animation:sk-tw 6.6s ease-in-out 1.9s infinite;"></span>
  </div>

  <!-- ============ SHOOTING STARS ============ -->
  <!-- Three of them, each starting from a different corner on its own long, unequal
       cycle (17s / 23s / 31s — deliberately co-prime-ish so they rarely coincide)
       and visible for only ~1.5–3s of it. In the app each new streak would also be
       re-seeded to a fresh random start point and angle after every pass. -->
  <div style="position:absolute; left:14%; top:11%; animation: sk-shootA 17s cubic-bezier(.3,.1,.6,1) 2.4s infinite;">
    <div style="width:112px; height:2px; border-radius:999px; transform: rotate(32deg); transform-origin: 0 50%;
         background: linear-gradient(90deg, rgba(233,233,237,0), rgba(210,206,253,.7) 55%, #f5f4ff);
         filter: drop-shadow(0 0 6px rgba(181,171,252,.9));"></div>
  </div>
  <div style="position:absolute; left:83%; top:23%; animation: sk-shootB 23s cubic-bezier(.3,.1,.6,1) 9.1s infinite;">
    <div style="width:86px; height:1.6px; border-radius:999px; transform: rotate(148deg); transform-origin: 0 50%;
         background: linear-gradient(90deg, rgba(233,233,237,0), rgba(210,206,253,.6) 55%, #eef0ff);
         filter: drop-shadow(0 0 5px rgba(181,171,252,.75));"></div>
  </div>
  <div style="position:absolute; left:33%; top:5%; animation: sk-shootC 31s cubic-bezier(.3,.1,.6,1) 15.6s infinite;">
    <div style="width:74px; height:1.4px; border-radius:999px; transform: rotate(53deg); transform-origin: 0 50%;
         background: linear-gradient(90deg, rgba(233,233,237,0), rgba(200,196,245,.5) 55%, #e7e5fe);
         filter: drop-shadow(0 0 4px rgba(181,171,252,.6));"></div>
  </div>

  <!-- ============ CONSTELLATION + MARKERS ============ -->
  <svg style="position:absolute; inset:0;" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <g stroke="rgba(207,211,229,.3)" stroke-width="1.2" stroke-dasharray="3 4">
      <line x1="72"  y1="300" x2="126" y2="268"/>
      <line x1="126" y1="268" x2="178" y2="292"/>
      <line x1="178" y1="292" x2="214" y2="256"/>
      <line x1="214" y1="256" x2="262" y2="276"/>
    </g>
  </svg>
  <div style="position:absolute; left:0; top:0; width:390px; height:844px; pointer-events:none;">
    <!-- a named bright star, with its catalogue tint and diffraction cross -->
    <div style="position:absolute; left:72px; top:300px; transform: translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;">
      <div style="position:relative; width:9px; height:9px;">
        <div style="position:absolute; inset:0; border-radius:50%; background:#ffd9c2; box-shadow:0 0 8px 2px rgba(255,217,194,.9), 0 0 18px 6px rgba(180,200,255,.3);"></div>
        <div style="position:absolute; left:50%; top:50%; width:40px; height:1px; transform:translate(-50%,-50%); background:linear-gradient(90deg,transparent,rgba(255,217,194,.75),transparent);"></div>
        <div style="position:absolute; left:50%; top:50%; width:1px; height:40px; transform:translate(-50%,-50%); background:linear-gradient(180deg,transparent,rgba(255,217,194,.75),transparent);"></div>
      </div>
      <span style="margin-top:9px; font-size:10.5px; font-weight:600; color:#e9e9ed; text-shadow:0 1px 4px rgba(0,0,0,.95);">Aldebaran</span>
    </div>
    <div style="position:absolute; left:126px; top:268px; transform:translate(-50%,-50%); width:5px; height:5px; border-radius:50%; background:#eef4ff; box-shadow:0 0 5px 1px rgba(238,244,255,.85);"></div>
    <div style="position:absolute; left:178px; top:292px; transform:translate(-50%,-50%); width:4px; height:4px; border-radius:50%; background:#eef4ff; box-shadow:0 0 4px 1px rgba(238,244,255,.7);"></div>
    <div style="position:absolute; left:214px; top:256px; transform:translate(-50%,-50%); width:5px; height:5px; border-radius:50%; background:#eef4ff; box-shadow:0 0 5px 1px rgba(238,244,255,.8);"></div>
    <div style="position:absolute; left:262px; top:276px; transform:translate(-50%,-50%); width:4px; height:4px; border-radius:50%; background:#eef4ff; box-shadow:0 0 4px 1px rgba(238,244,255,.7);"></div>
    <span style="position:absolute; left:168px; top:318px; font-size:12.5px; font-weight:600; letter-spacing:.02em; color:rgba(233,233,237,.82); text-shadow:0 1px 4px rgba(0,0,0,.95);">Taurus the Bull</span>

    <!-- a planet marker -->
    <div style="position:absolute; left:288px; top:392px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;">
      <span style="width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 33% 28%, #fff, #f7e3b4 42%, #b8863c 88%); box-shadow:0 0 18px rgba(233,233,237,.4), inset -2px -3px 6px rgba(0,0,0,.5);"></span>
      <span style="margin-top:8px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#e9e9ed; text-shadow:0 1px 4px rgba(0,0,0,.95);">Venus</span>
    </div>
  </div>

  <!-- ============ RETICLE ============ -->
  <div style="position:absolute; left:50%; top:44%; width:150px; height:150px; margin:-75px 0 0 -75px; pointer-events:none;">
    <span style="position:absolute; inset:0; border-radius:50%; border:1px solid rgba(181,171,252,.45); animation: sk-ret 2.8s ease-in-out infinite; display:block;"></span>
    <span style="position:absolute; inset:34px; border-radius:50%; border:1px dashed rgba(181,171,252,.3); display:block;"></span>
    <span style="position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px; border-radius:50%; background:#e7e5fe; box-shadow:0 0 10px #b5abfc; display:block;"></span>
  </div>

  <!-- ============ HORIZON ============ -->
  <div style="position:absolute; left:-40px; right:-40px; bottom:-150px; height:300px; border-radius:50%;
      background: linear-gradient(#2b2741 0%, #1a1b2e 42%, #131426 100%);
      box-shadow: 0 -1px 0 rgba(181,171,252,.4), 0 -22px 70px rgba(66,58,106,.55);"></div>

  <!-- ============ HEADER ============ -->
  <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 52px 18px 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b5abfc; box-shadow: 0 0 12px #9184d9;"></span>
      <span style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #9397ab; font-weight: 600;">Mission control</span>
    </div>
    <span style="display: flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 999px; background: rgba(35,37,50,.55); border: 1px solid rgba(150,138,224,.28); color: #d2cefd; font-size: 12px; font-weight: 700;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#b5abfc"><path d="M12 2.6l2.7 5.9 6.4.7-4.8 4.3 1.3 6.3L12 16.6 6.4 19.8l1.3-6.3L2.9 9.2l6.4-.7z"/></svg>
      4/10
    </span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 104px;">
    <h1 style="font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 0; color: #e9e9ed;">Point up</h1>
    <p style="font-size: 14px; margin: 4px 0 0; color: #cfd3e5;">Move your phone to find what's glowing.</p>
    <p style="font-size: 13px; font-weight: 600; margin: 9px 0 0; color: #e7e5fe;">Venus and the Moon meet on Aug 15!</p>
  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding-bottom: 14px; background: rgba(22,24,38,.92); border-top: 1px solid #3f424d;">
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid transparent; color:#75798c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/><path d="M3.4 8.6c1.6-1.6 5.4-1.3 9.4.7s6.6 4.9 6 6.9c-.4 1.4-2.2 2.1-4.6 2v-2c1.7.1 2.6-.3 2.7-.6.2-.6-1.4-2.8-4.9-4.5s-6.2-1.7-6.6-1.3c-.3.3-.1 1.2.8 2.4l-1.6 1.2c-1.3-1.8-1.7-3.6-1.2-4.8z"/></svg>
      <span style="font-size:12px; font-weight:600;">Explore</span>
    </div>
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid #9184d9; background:rgba(66,58,106,.45); color:#e7e5fe;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h3a1 1 0 0 1 1 1v5H6V5a1 1 0 0 1 1-1zm7 0h3a1 1 0 0 1 1 1v5h-5V5a1 1 0 0 1 1-1zM6 11.5h5v2.2a2.5 2.5 0 1 1-5 0zm7 0h5v2.2a2.5 2.5 0 1 1-5 0z"/><circle cx="8.5" cy="16.5" r="3.5"/><circle cx="15.5" cy="16.5" r="3.5"/></svg>
      <span style="font-size:12px; font-weight:600;">Sky</span>
    </div>
    <div style="flex:1; margin:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 0; border-radius:16px; border:1px solid transparent; color:#75798c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="9" r="6"/><path d="M8.4 14.6 7 21.5l5-2.4 5 2.4-1.4-6.9a7.9 7.9 0 0 1-7.2 0z"/></svg>
      <span style="font-size:12px; font-weight:600;">Badges</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
